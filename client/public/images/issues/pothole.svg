<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="roadBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="crater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#roadBg)"/>
  <!-- Road Markings -->
  <line x1="0" y1="175" x2="600" y2="175" stroke="#fbbf24" stroke-width="6" stroke-dasharray="35 25" opacity="0.3"/>
  <!-- Crater Hole -->
  <ellipse cx="300" cy="180" rx="150" ry="70" fill="url(#crater)" stroke="#475569" stroke-width="3"/>
  <!-- Asphalt cracks -->
  <path d="M150 180 L100 150 M150 200 L80 230 M450 170 L510 140 M450 190 L520 220" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <!-- Warning Hazard Cone -->
  <polygon points="410,220 395,140 425,140" fill="#f97316"/>
  <polygon points="400,170 420,170 422,185 398,185" fill="#ffffff"/>
  <rect x="390" y="220" width="40" height="8" rx="2" fill="#ea580c"/>
  <!-- Text Label -->
  <text x="300" y="270" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Road Shoulder Erosion &amp; Pothole Hazard</text>
  <!-- Badge -->
  <rect x="20" y="20" width="190" height="30" rx="8" fill="#000000" fill-opacity="0.5"/>
  <text x="32" y="40" fill="#f97316" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">POTHOLE &amp; ROAD EROSION</text>
</svg>

