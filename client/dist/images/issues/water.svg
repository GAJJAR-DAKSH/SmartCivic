<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="waterBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#waterBg)"/>
  <!-- Pipeline -->
  <rect x="0" y="150" width="600" height="50" fill="#334155" stroke="#475569" stroke-width="3"/>
  <rect x="270" y="142" width="30" height="66" rx="4" fill="#64748b"/>
  <!-- Water Burst Spray -->
  <path d="M285 142 Q 260 60 300 25 Q 340 60 285 142" fill="#38bdf8" fill-opacity="0.8"/>
  <circle cx="295" cy="45" r="10" fill="#e0f2fe" fill-opacity="0.9"/>
  <circle cx="320" cy="70" r="7" fill="#bae6fd" fill-opacity="0.8"/>
  <circle cx="270" cy="80" r="9" fill="#bae6fd" fill-opacity="0.8"/>
  <!-- Surface Water Pool -->
  <ellipse cx="300" cy="270" rx="200" ry="35" fill="#0284c7" fill-opacity="0.6"/>
  <!-- Text Label -->
  <text x="300" y="240" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Drinking Water Pipeline Leakage</text>
  <!-- Badge -->
  <rect x="20" y="20" width="190" height="30" rx="8" fill="#000000" fill-opacity="0.5"/>
  <text x="32" y="40" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">WATER PIPELINE BURST</text>
</svg>

